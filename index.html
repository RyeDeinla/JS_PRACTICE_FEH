<!DOCTYPE html>

<html lang="en">

<head>
    
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title> Practice FEH </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"; rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

    <div class="container">

        <details ontoggle="message()">

            <summary> Instructions </summary>

            <i> Enter two numbers and find their sum/difference.  </i>

        </details>

        <form>

            <label> Enter 1st Number </label>

            <input type="number" id="num1" placeholder="Type here...">

            <br> <br>

            <label> Enter 2nd Number </label>

            <input type="number" id="num2" placeholder="Type here...">

            <br> <br>

            <button type="button" onclick="plus()"> Calculate for sum: </button>

            <br> <br>

            <button type="button" onclick="difference()"> Calculate for difference: </button>

            <h1 id="result"> Result: </h1>

        </form>

    </div>

    <script>

        function message(){

            alert("Try it");

        }

        function plus(){

            var add1 = document.getElementById("num1").value;

            var add2 = document.getElementById("num2").value;

            var sum = Number(add1) + Number(add2);

            document.getElementById("result").innerHTML = "Answer is" + " " + sum;

        }

        function difference(){

            var diff1 = document.getElementById("num1").value;

            var diff2 = document.getElementById("num2").value;

            var difference = Number(diff1) - Number(diff2);

            document.getElementById("result").innerHTML = "Answer is" + " " + difference;

}

    </script>

</body>

</html>
